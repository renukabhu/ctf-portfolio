<!DOCTYPE html>
<html lang="en">
<body>
    <h1>Orders</h1>
    <h3>Hello {{ username }}! Here are the flags you currently have ordered.</h3>
    <h2>Your Ordered Flags</h2>

    {% if flags %}
        <ul>
            {% for flag in flags %}
                <li>{{ flag }}</li>
            {% endfor %}
        </ul>
    {% else %}
        <p>You haven't ordered any flags yet.</p>
    {% endif %}
</body>
</html>
