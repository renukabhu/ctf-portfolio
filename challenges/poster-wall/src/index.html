<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Poster Wall</title>
<style>
  body {
    background: #f0f0f0;
    margin: 0;
    font-family: sans-serif;
    height: 100vh;
    position: relative;
  }

  .poster {
    width: 200px;
    height: 300px;
    position: absolute;
    border: 3px solid #ccc;
    border-radius: 5px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    object-fit: cover;
    cursor: grab;
  }

  /* Push pin */
  .pin {
    width: 20px;
    height: 20px;
    position: absolute;
    border-radius: 50%;
    background: red;
    border: 2px solid #333;
    z-index: 10;
  }
</style>
<!-- portfolio: backend ported to run in the browser -->
<script src="../../emu/client.js"></script>
</head>
<body>

  <!-- Posters (replace src with your own images) -->
  <img class="poster" src="https://i.kym-cdn.com/entries/icons/original/000/056/430/gpcover.jpg" alt="Poster 1" style="top: 50px; left: 50px;">
  <img class="poster" src="https://picsum.photos/200/300?random=2" alt="Poster 2" style="top: 50px; left: 300px;">
  <img class="poster" src="https://picsum.photos/200/300?random=3" alt="Poster 3" style="top: 400px; left: 50px;">
  <img class="poster" src="https://picsum.photos/200/300?random=4" alt="Poster 4" style="top: 400px; left: 300px;">

  <!-- Push pins -->
  <div class="pin" style="top: 40px; left: 40px;"></div>
  <div class="pin" style="top: 40px; left: 290px;"></div>
  <div class="pin" style="top: 390px; left: 40px;"></div>
  <div class="pin" style="top: 390px; left: 290px;"></div>

  <!--
    TODO: finish the "add poster" button. admin only!!
    fetch("/newPoster", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ user: "guest", poster: "https://..." })
    });
  -->

  <script>
    // Make posters draggable
    const posters = document.querySelectorAll(".poster");

    posters.forEach(poster => {
      poster.onmousedown = function(e) {
        e.preventDefault();
        let shiftX = e.clientX - poster.getBoundingClientRect().left;
        let shiftY = e.clientY - poster.getBoundingClientRect().top;

        function moveAt(pageX, pageY) {
          poster.style.left = pageX - shiftX + 'px';
          poster.style.top = pageY - shiftY + 'px';
        }

        function onMouseMove(event) {
          moveAt(event.pageX, event.pageY);
        }

        document.addEventListener('mousemove', onMouseMove);

        poster.onmouseup = function() {
          document.removeEventListener('mousemove', onMouseMove);
          poster.onmouseup = null;
        };
      };

      poster.ondragstart = () => false; // disable default drag
    });
  </script>

</body>
</html>
